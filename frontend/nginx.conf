# Server block for nginxinc/nginx-unprivileged (runs as uid 101, listens on 8080).
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # config.js carries the version: never cache it (nor the page) so a new release shows at once.
    location ~ ^/(index\.html|config\.js)?$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'" always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri =404;
    }
}
